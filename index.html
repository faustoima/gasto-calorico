      const muscle=metric(x,['muscle','musclePct','muscleMass']); if(muscle!=null) state.muscle=muscle;
      const visceral=metric(x,['visceralFat','visceral','visceralLevel','visceralFatLevel']); if(visceral!=null) state.visceral=visceral;
      const storedBmi=metric(x,['bmi','imc']); if(storedBmi!=null) state.bmi=storedBmi; else if(state.weight!=null && n(height)>0) state.bmi=state.weight/((Number(height)/100)**2);
      if(Object.values(state).some(v=>v!=null)) data.push({date:x.date,...state});
    }
    return data;
  }
  function chartSvg(data){
    if(!data.length) return '<p style="color:#667085">Registre medidas corporais para visualizar a evolução.</p>';
    const series=[['Peso','weight','#0E2C4B'],['IMC','bmi','#7C3AED'],['Gordura corporal','fat','#DC2626'],['Músculo','muscle','#059669'],['Gordura visceral','visceral','#D97706']];
    const vals=data.flatMap(d=>series.map(s=>d[s[1]])).filter(v=>v!=null); const lo=Math.min(...vals), hi=Math.max(...vals), span=(hi-lo)||1;
    const W=760,H=250,L=42,R=12,T=18,B=34, x=i=>L+i*Math.max(1,(W-L-R)/Math.max(1,data.length-1)), y=v=>T+(hi-v)/span*(H-T-B);
    const lines=series.map(([label,key,color])=>{const pts=data.map((d,i)=>d[key]==null?'':`${x(i)},${y(d[key])}`).filter(Boolean).join(' ');return pts?`<polyline fill="none" stroke="${color}" stroke-width="2" points="${pts}"/>`:''}).join('');
    const dots=series.map(([label,key,color])=>data.map((d,i)=>d[key]==null?'':`<circle cx="${x(i)}" cy="${y(d[key])}" r="2.5" fill="${color}"/>`).join('')).join('');
    const legend=series.map(([label,key,color])=>`<span style="color:${color};margin-right:12px">● ${label}</span>`).join('');
    const table=data.map(d=>`<tr><td>${esc(fmtDateBR(d.date))}</td><td>${fmt(d.weight)}</td><td>${fmt(d.bmi)}</td><td>${fmt(d.fat)}%</td><td>${fmt(d.muscle)}%</td><td>${fmt(d.visceral)}</td></tr>`).join('');
    const touchPoints=data.map((d,i)=>`<circle class="pd-evolution-point" data-index="${i}" cx="${x(i)}" cy="${T+(hi-(d.weight??d.bmi??d.fat??d.muscle??d.visceral))/span*(H-T-B)}" r="13" fill="transparent" stroke="transparent"/>`).join('');
    const tooltip=`<div class="pd-evolution-tooltip" style="display:none;margin-top:8px;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;font-size:12px;line-height:1.55"></div>`;
    return `<div style="overflow:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:560px;height:250px;background:#fff;border:1px solid #e5e7eb;border-radius:8px"><line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#cbd5e1"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#cbd5e1"/>${lines}${dots}${touchPoints}</svg></div><div style="font-size:12px;margin:8px 0">${legend}</div>${tooltip}<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th>Data</th><th>Peso kg</th><th>IMC</th><th>Gordura %</th><th>Músculos %</th><th>Gordura visceral</th></tr></thead><tbody>${table}</tbody></table></div>`;
  }
  async function renderEvolution(){
    addWorkoutEditors();
    if(!activePanel()) return;
    const root=document.querySelector('[data-testid="section-summary"]')?.parentElement || document.getElementById('root');
    if(!root || root.querySelector('[data-testid="body-evolution-panel"]')) return;
    try{
      const [body,profile]=await Promise.all([fetchJson('/body'),fetchJson('/profile')]);
      const data=makeEvolution(body,profile.heightCm);
      const card=document.createElement('section'); card.dataset.testid='body-evolution-panel'; card.className='rounded-xl border border-card-border bg-card p-4 sm:p-5';
      card.innerHTML=`<h2 class="text-base font-semibold">Evolução corporal</h2><p class="mt-1 text-xs" style="color:#667085">Quando uma medição não existe em uma data, o gráfico mantém o último valor informado. Toque em um ponto para ver todos os indicadores daquela data.</p><div style="margin-top:12px">${chartSvg(data)}</div>`;
      card.querySelectorAll('.pd-evolution-point').forEach(function(point){ point.addEventListener('click',function(){ const d=data[Number(point.dataset.index)], tip=card.querySelector('.pd-evolution-tooltip'); tip.style.display='block'; tip.innerHTML='<b>'+esc(fmtDateBR(d.date))+'</b><br>Peso: '+fmt(d.weight)+' kg<br>IMC: '+fmt(d.bmi)+'<br>Gordura: '+fmt(d.fat)+'%<br>Músculos: '+fmt(d.muscle)+'%<br>Gordura visceral: '+fmt(d.visceral); }); });
      root.appendChild(card);
    }catch(e){ console.warn('Evolução corporal:',e); }
  }
  async function printReport(){
    try{
      const [body,profile,entries,workouts,daily]=await Promise.all([fetchJson('/body'),fetchJson('/profile'),fetchJson('/entries'),fetchJson('/workouts'),fetchJson('/daily')]);
      const data=makeEvolution(body,profile.heightCm); const box=document.getElementById('pd-print-report');
      box.innerHTML=`<h1>Prato do Dia — Relatório do Painel</h1><p>Gerado em ${new Date().toLocaleString('pt-BR')}</p><h2>Perfil</h2><p>Nome: ${esc(profile.name||'')} · Altura: ${fmt(profile.heightCm)} cm · Peso: ${fmt(profile.weightKg)} kg</p><h2>Evolução corporal</h2>${chartSvg(data)}<h2>Resumo dos registros</h2><p>Alimentação: ${entries.length} lançamentos · Exercícios: ${workouts.length} lançamentos · Dias de hidratação: ${daily.length}</p>`;
      window.print();
    }catch(e){ alert('Não foi possível montar o relatório.'); }
  }
  function addPdfButton(){
    return;
    if(document.querySelector('[data-pd-pdf]')) return;
    const b=document.createElement('button'); b.dataset.pdPdf='1'; b.textContent='Relatório PDF'; b.type='button';
    b.style.cssText='position:fixed;left:14px;bottom:18px;z-index:9998;border:0;border-radius:10px;padding:11px 14px;background:#0E2C4B;color:#fff;font:600 14px system-ui;box-shadow:0 4px 14px #0003;cursor:pointer'; b.onclick=printReport; document.body.appendChild(b);
  }
  const obs=new MutationObserver(()=>{addWorkoutEditors();addPdfButton();renderEvolution();});
  obs.observe(document.body,{subtree:true,childList:true});
  document.addEventListener('click',e=>{if(e.target.closest('[data-testid^="tab-"]')) setTimeout(()=>{document.querySelector('[data-testid="body-evolution-panel"]')?.remove();renderEvolution();},100);});
  // O relatório único é o botão Dados/PDF do módulo pd-data.js.
})();
</script>
