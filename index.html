  <body>
    <div id="root"></div>

    <!-- Service Worker -->
    <script>
      (function () {
        if (!("serviceWorker" in navigator) || !/^https:|^http:\/\/localhost/.test(location.protocol + "//" + location.host)) return;
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).then(function () {
          if (!navigator.serviceWorker.controller && !sessionStorage.getItem("pd-sw-reloaded")) {
            sessionStorage.setItem("pd-sw-reloaded", "1");
            location.reload();
          }
        }).catch(function (err) { console.warn("Prato do Dia: Service Worker não registrado", err); });
      })();
    </script>

    <!-- Botão Instalar -->
    <script>
      try { localStorage.setItem("prato-do-dia:usuario", "principal"); } catch (_) {}
      (function () {
        let installEvent = window.__pdInstallEvent || null;
        const button = document.createElement("button");
        button.textContent = "⇩ Instalar";
        button.setAttribute("aria-label", "Instalar Prato do Dia");
        button.style.cssText = "position:fixed;right:14px;bottom:18px;z-index:9999;border:0;border-radius:10px;padding:11px 14px;background:#0E2C4B;color:#fff;font:600 14px system-ui;box-shadow:0 4px 14px #0003;cursor:pointer";
        button.hidden = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
        document.body.appendChild(button);
        window.addEventListener("beforeinstallprompt", function (event) {
          event.preventDefault();
          installEvent = event;
          window.__pdInstallEvent = event;
          button.hidden = false;
        });
        window.addEventListener("appinstalled", function () { button.hidden = true; });
        window.__pdInstallUnavailable = function () {
          const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
          alert(ios
            ? "No iPhone/iPad, a instalação é feita pelo Safari: toque em Compartilhar e depois em Adicionar à Tela de Início."
            : "O Chrome ainda não liberou o pedido nativo de instalação para esta visita. Feche outras abas deste site, recarregue a página e toque novamente em Instalar.");
        };
        button.addEventListener("click", async function () {
          if (!installEvent && window.__pdInstallEvent) installEvent = window.__pdInstallEvent;
          if (!installEvent) { window.__pdInstallUnavailable(); return; }
          try { await installEvent.prompt(); } catch (_) { window.__pdInstallUnavailable(); }
          installEvent = null;
          window.__pdInstallEvent = null;
          button.hidden = true;
        });
      })();
    </script>

    <!-- Fallback de boot -->
    <script>
      window.addEventListener("load", function () {
        setTimeout(function () {
          const root = document.getElementById("root");
          if (root && root.children.length === 0) {
            import("./assets/index-CZ9VoIu1.js?boot=8").catch(function () {
              root.innerHTML = '<div style="padding:24px;font:16px system-ui;color:#0E2C4B">Não foi possível carregar o aplicativo. Feche e abra novamente.</div>';
            });
          }
        }, 900);
      });
    </script>

    <!-- Exportar / Importar / Relatório — ÚNICO arquivo novo -->
    <script defer src="./assets/pd-data.js"></script>

    <!-- Painel de evolução (script original) -->
    <script>
    (function () {
      let panel = null, period = 30;
      const css = "margin-top:18px;border:1px solid #d4dfd9;border-radius:14px;padding:16px;background:var(--card,#fff);color:var(--foreground,#17352e)";
      function activePanel(){const tab=document.querySelector('[data-testid="tab-painel"]');return !!tab&&tab.className.includes('bg-primary')}
      function esc(v){return String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
      function draw(){
        if(!panel)return;
        fetch('./port/5000/api/export.json?u=principal').then(r=>r.json()).then(d=>{
          const rows=(d.data?.body||[]).filter(x=>x&&x.date).sort((a,b)=>String(a.date).localeCompare(String(b.date))).slice(-period);
          const nums=rows.map(x=>Number(x.weight)).filter(Number.isFinite); const min=nums.length?Math.min(...nums):0; const max=nums.length?Math.max(...nums):1; const range=Math.max(max-min,1);
          const points=rows.map((x,i)=>{const px=20+(i*360/Math.max(rows.length-1,1));const py=145-((Number(x.weight)-min)/range)*105;return `${px.toFixed(1)},${py.toFixed(1)}`}).join(' ');
          const last=rows[rows.length-1]||{}; const first=rows[0]||{}; const diff=(a,b)=>Number.isFinite(Number(a))&&Number.isFinite(Number(b))?`${Number(a)-Number(b)>=0?'+':''}${(Number(a)-Number(b)).toFixed(1)}`:'—';
          panel.innerHTML=`<h2 style="margin:0;font-size:17px">Evolução das medidas</h2><p style="margin:5px 0 10px;color:#71817b;font-size:12px">Peso e medidas registradas na aba Corpo</p><div style="display:flex;gap:6px;margin-bottom:10px">${[7,14,30].map(n=>`<button data-pd-period="${n}" style="border:1px solid #2d8061;border-radius:8px;padding:6px 10px;background:${period===n?'#2d8061':'transparent'};color:${period===n?'#fff':'inherit'}">${n} dias</button>`).join('')}</div>${rows.length?`<svg viewBox="0 0 400 170" width="100%" height="180" role="img" aria-label="Gráfico de evolução do peso"><line x1="20" y1="145" x2="380" y2="145" stroke="#ccd8d1"/><polyline fill="none" stroke="#2d8061" stroke-width="3" points="${points}"/>${rows.map((x,i)=>{const px=20+(i*360/Math.max(rows.length-1,1));const py=145-((Number(x.weight)-min)/range)*105;return `<circle cx="${px}" cy="${py}" r="4" fill="#e98c4a"/>`}).join('')}<text x="20" y="165" font-size="10" fill="#71817b">${esc(rows[0].date)}</text><text x="330" y="165" font-size="10" fill="#71817b">${esc(last.date)}</text></svg>`:'<p style="padding:20px 0;color:#71817b">Ainda não há medidas suficientes para desenhar o gráfico.</p>'}<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:13px"><div><b>Peso atual</b><br>${last.weight??'—'} kg</div><div><b>Variação no período</b><br>${diff(last.weight,first.weight)} kg</div><div><b>Cintura atual</b><br>${last.waist??'—'} cm</div><div><b>Gordura atual</b><br>${last.bodyFat??'—'}%</div></div>`;
          panel.querySelectorAll('[data-pd-period]').forEach(b=>b.addEventListener('click',()=>{period=Number(b.dataset.pdPeriod);draw()}));
        });
      }
      function sync(){const main=document.querySelector('main');if(!main)return;if(!panel){panel=document.createElement('section');panel.id='pd-evolution';panel.style.cssText=css}if(activePanel()){if(!panel.isConnected)main.appendChild(panel);draw()}else if(panel.isConnected)panel.remove()}
      document.addEventListener('click',e=>{const tab=e.target.closest('[data-testid^="tab-"]');if(!tab)return;if(tab.dataset.testid==="tab-painel")setTimeout(sync,50);else if(panel?.isConnected)panel.remove()});
      setTimeout(sync,1200);
    })();
    </script>
  </body>
