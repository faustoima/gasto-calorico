<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102a24">
  <meta name="description" content="Prato do Dia: acompanhe alimentação, exercícios e composição corporal.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>Prato do Dia</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">✦</span><div><strong>Prato do Dia</strong><small>seu diário de saúde</small></div></div>
    <button id="installBtn" class="install-btn" hidden>⇩ Instalar app</button>
  </header>
  <main class="shell">
    <section id="view-dashboard" class="view active"></section>
    <section id="view-food" class="view"></section>
    <section id="view-exercise" class="view"></section>
    <section id="view-body" class="view"></section>
    <section id="view-settings" class="view"></section>
    <section id="view-help" class="view"></section>
  </main>
  <nav class="bottom-nav" aria-label="Navegação principal">
    <button data-view="dashboard" class="nav-item active"><span>⌂</span><small>Hoje</small></button>
    <button data-view="food" class="nav-item"><span>＋</span><small>Comida</small></button>
    <button data-view="exercise" class="nav-item"><span>↗</span><small>Treino</small></button>
    <button data-view="body" class="nav-item"><span>◒</span><small>Corpo</small></button>
    <button data-view="settings" class="nav-item"><span>⚙</span><small>Ajustes</small></button>
  </nav>
  <div id="toast" class="toast" role="status"></div>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
